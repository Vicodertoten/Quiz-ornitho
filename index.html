<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Pour iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-192.png">

  <title>Quiz Ornitho Offline</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#228B22">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Quiz Ornitho</h1>
    <nav>
      <button onclick="startQuiz('image')">Quiz Image</button>
      <button onclick="startQuiz('mixte')">Quiz Mixte</button>
      <button onclick="startTextQuiz('image')">Quiz Image (Texte)</button>
      <button onclick="startTextQuiz('mixte')">Quiz Mixte (Texte)</button>
      <button onclick="showExplorer()">Explorer</button>
    </nav>
  </header>

  <main id="main-content">
    <!-- contenu dynamique ici -->
  </main>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('✅ Service Worker enregistré'))
        .catch(err => console.warn('❌ Échec SW :', err));
    }
  </script>
</body>
</html>
